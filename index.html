<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Love Me? 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #ffe6f0, #ffd1dc, #ffb6c1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', 'Fredoka', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }
    .heart-trail {
      position: fixed;
      pointer-events: none;
      font-size: 1.2rem;
      animation: floatUp 1.2s ease-out forwards;
      z-index: 9999;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(0, -60px) scale(0.3); }
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid #ff7597;
      border-radius: 28px;
      padding: 30px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 105, 145, 0.25);
      position: relative;
    }
    .bears-img { width: 180px; height: 140px; margin: 0 auto 15px; }
    h1 { color: #d81b60; font-size: 1.8rem; margin-bottom: 20px; font-weight: 900; }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 90px;
      position: relative;
    }
    .btn {
      padding: 12px 34px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease;
    }
    .btn-yes { background: #ff4081; color: white; }
    .btn-yes:hover { transform: scale(1.1); }
    .btn-no {
      background: #757575;
      color: white;
      position: relative;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hidden { display: none !important; }
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ff80ab;
      border-radius: 14px;
      font-family: inherit;
      margin-top: 15px;
      resize: none;
      height: 80px;
    }
    .submit-btn {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="bears-img">
      <!-- رسوم كرتونية Bubu & Dudu -->
      <svg viewBox="0 0 200 150" width="100%" height="100%">
        <circle cx="70" cy="80" r="45" fill="#a0603e" />
        <circle cx="45" cy="45" r="15" fill="#a0603e" />
        <circle cx="95" cy="45" r="15" fill="#a0603e" />
        <circle cx="60" cy="75" r="5" fill="#000" />
        <circle cx="80" cy="75" r="5" fill="#000" />
        
        <circle cx="130" cy="80" r="43" fill="#ffffff" stroke="#eee" />
        <circle cx="108" cy="48" r="13" fill="#333" />
        <circle cx="152" cy="48" r="13" fill="#333" />
        <ellipse cx="120" cy="75" rx="5" ry="6" fill="#333" />
        <ellipse cx="140" cy="75" rx="5" ry="6" fill="#333" />
        <path d="M 95 65 Q 100 55 105 65 A 6 6 0 0 1 115 65 Q 115 75 100 85 Q 85 75 85 65 A 6 6 0 0 1 95 65 Z" fill="#ff4081" />
      </svg>
    </div>

    <h1 id="questionText">Do You Love Me? 🥺❤️</h1>

    <div class="btn-container" id="btnBox">
      <button class="btn btn-yes" id="yesBtn">نعم 🥰</button>
      <button class="btn btn-no" id="noBtn">لا 😢</button>
    </div>

    <!-- شاشة إرسال الرسالة بعد الضغط على نعم -->
    <div id="resultBox" class="hidden">
      <h2 style="color: #ff4081; margin-bottom: 10px;">كنت متأكد(ة)! 🥰💍</h2>
      <textarea id="visitorMsg" placeholder="اكتب(ي) رسالة أو اعتراف هنا..."></textarea>
      <button class="submit-btn" id="sendMsgBtn">إرسال الرسالة 💌</button>
      <p id="sentAlert" style="color: #4caf50; font-size: 0.9rem; margin-top: 8px;" class="hidden">تم استلام رسالتك بحب! ❤️</p>
    </div>
  </div>

  <script>
    // 1. ضعي رابط Google Apps Script الخاص بكِ هنا:
    const GOOGLE_SCRIPT_URL = "هنا_ضعي_رابط_جوجل_سكربت_الذي_ينتهي_بـ_exec";

    const params = new URLSearchParams(window.location.search);
    const visitorName = params.get('name') || "زائر";
    const visitorFb = params.get('fb') || "";

    if (visitorName !== "زائر") {
      document.getElementById('questionText').innerText = `بتحبني يا ${visitorName}؟ 🥺❤️`;
    }

    let noCount = 0;
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    // إرسال البيانات للإكسل
    function sendToSheet(status, msg = "") {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("هنا_ضعي")) return;

      const payload = {
        name: visitorName,
        facebook: visitorFb,
        status: status,
        no_attempts: noCount,
        message: msg
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.log(err));
    }

    // تسجيل الدخول فور فتح الصفحة
    sendToSheet("فتح الرابط 👀");

    // زر لا يهرب
    function moveNoBtn() {
      noCount++;
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 80);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      
      const phrases = ["متأكد؟", "فكر تاني", "بلاش دي!", "مش هتعرف تدوسني", "عيب كدة 🥺"];
      noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
    }

    noBtn.addEventListener('mouseover', moveNoBtn);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoBtn(); });

    // زر نعم
    yesBtn.addEventListener('click', () => {
      document.getElementById('btnBox').classList.add('hidden');
      document.getElementById('resultBox').classList.remove('hidden');
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      sendToSheet("اختار نعم! 🥰");
    });

    // إرسال الرسالة
    document.getElementById('sendMsgBtn').addEventListener('click', () => {
      const msg = document.getElementById('visitorMsg').value;
      if (!msg) return;
      sendToSheet("كتب رسالة ❤️", msg);
      document.getElementById('sentAlert').classList.remove('hidden');
      document.getElementById('sendMsgBtn').disabled = true;
    });

    // قلوب تتبع الماوس واللمس
    function createHeart(x, y) {
      const h = document.createElement('span');
      h.className = 'heart-trail';
      h.innerText = ['💖', '💕', '🌸', '✨'][Math.floor(Math.random() * 4)];
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }
    window.addEventListener('mousemove', (e) => createHeart(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => createHeart(e.touches[0].clientX, e.touches[0].clientY));
  </script>
</body>
</html>
